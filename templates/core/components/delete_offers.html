<div style="
  border: 2px solid rgb(75 70 74);
  border-radius: 0.5em;
  font: 1.2em sans-serif;
  height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;"
>
    <form method="post" action="{% url 'offers_delete' product_id=product.id%}" onsubmit="return confirm ('Вы уверены?')" enctype="multipart/form-data">
        {% csrf_token %}
        <button type="submit" style="background-color: red; color: white" >Удалить всё!</button>
    </form>
</div>
