<div class="product-order__actions product-order__desktop-only">
    <form method="post" action="{% url 'offers_add' product_id=product.id%}" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" name="excel_file" class="product-order__action-btn product-order__action-btn_file">
        <button type="submit" class="product-order__action-btn product-order__action-btn_upload">Загрузить
            коды</button>
    </form>
    <form method="post" action="{% url 'offers_delete' product_id=product.id%}" onsubmit="return confirm ('Вы уверены?')" enctype="multipart/form-data">
        {% csrf_token %}
        <button type="submit" class="product-order__action-btn product-order__action-btn_delete">Удалить все</button>
    </form>
</div>
