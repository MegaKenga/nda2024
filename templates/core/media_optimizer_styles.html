<style>
    #media-optimizer, .media-optimizer-page {
        --mo-blue: #3391c5;
        --mo-dark: #00304e;
        --mo-text: #1a1a1a;
        --mo-text-muted: #444;
        color: var(--mo-text);
    }
    #media-optimizer *, .media-optimizer-page * { box-sizing: border-box; }
    #media-optimizer h1,
    .media-optimizer-page h1 {
        color: var(--mo-text);
    }
    #media-optimizer .mo-panel,
    .media-optimizer-page .mo-panel {
        background: #fff;
        color: var(--mo-text);
        border-radius: 8px;
        padding: 20px;
        border: 1px solid #ddd;
        margin-bottom: 20px;
    }
    #media-optimizer .mo-grid,
    .media-optimizer-page .mo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
    }
    #media-optimizer label,
    .media-optimizer-page label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
        color: var(--mo-text) !important;
    }
    #media-optimizer input[type="number"],
    #media-optimizer input[type="text"],
    .media-optimizer-page input[type="number"],
    .media-optimizer-page input[type="text"] {
        width: 100%;
        height: 38px;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 0 10px;
        background: #fff;
        color: var(--mo-text);
    }
    #media-optimizer .mo-checkbox,
    .media-optimizer-page .mo-checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        font-weight: 400;
        color: var(--mo-text) !important;
    }
    #media-optimizer .mo-actions,
    .media-optimizer-page .mo-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 20px;
    }
    #media-optimizer .mo-btn,
    .media-optimizer-page .mo-btn {
        border: none;
        border-radius: 4px;
        padding: 10px 18px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        font: inherit;
    }
    #media-optimizer .mo-btn:disabled,
    .media-optimizer-page .mo-btn:disabled { opacity: .55; cursor: not-allowed; }
    #media-optimizer .mo-btn-primary,
    .media-optimizer-page .mo-btn-primary { background: var(--mo-blue); color: #fff; }
    #media-optimizer .mo-btn-secondary,
    .media-optimizer-page .mo-btn-secondary { background: var(--mo-dark); color: #fff; }
    #media-optimizer .mo-btn-light,
    .media-optimizer-page .mo-btn-light { background: #f2f2f2; color: #1a1a18; }
    #media-optimizer .mo-btn-danger,
    .media-optimizer-page .mo-btn-danger { background: #dc3545; color: #fff; }
    #media-optimizer .mo-btn-warning,
    .media-optimizer-page .mo-btn-warning { background: #f0ad4e; color: #1a1a18; }
    #media-optimizer .mo-status-bar,
    .media-optimizer-page .mo-status-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 16px;
    }
    #media-optimizer .mo-badge,
    .media-optimizer-page .mo-badge {
        display: inline-flex;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 13px;
        background: #f2f2f2;
        color: var(--mo-text);
    }
    #media-optimizer .mo-badge.running,
    .media-optimizer-page .mo-badge.running { background: #fff3cd; color: #856404; }
    #media-optimizer .mo-badge.done,
    .media-optimizer-page .mo-badge.done { background: #d4edda; color: #155724; }
    #media-optimizer .mo-badge.error,
    .media-optimizer-page .mo-badge.error { background: #f8d7da; color: #721c24; }
    #media-optimizer .mo-badge.cancelled,
    .media-optimizer-page .mo-badge.cancelled { background: #e2e3e5; color: #383d41; }
    #media-optimizer .mo-stats,
    .media-optimizer-page .mo-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 10px;
        margin-bottom: 16px;
    }
    #media-optimizer .mo-stat,
    .media-optimizer-page .mo-stat {
        background: #f8fbfd;
        border: 1px solid #e6eef5;
        border-radius: 8px;
        padding: 12px;
    }
    #media-optimizer .mo-stat strong,
    .media-optimizer-page .mo-stat strong {
        display: block;
        font-size: 22px;
        color: var(--mo-blue);
    }
    #media-optimizer .mo-stat span,
    .media-optimizer-page .mo-stat span { font-size: 12px; color: var(--mo-text-muted); }
    #media-optimizer .mo-log,
    .media-optimizer-page .mo-log {
        background: #0f172a;
        color: #e2e8f0;
        border-radius: 8px;
        padding: 16px;
        min-height: 360px;
        max-height: 65vh;
        overflow: auto;
        font: 13px/1.5 Consolas, "Courier New", monospace;
        white-space: pre-wrap;
    }
    #media-optimizer .mo-log-line,
    .media-optimizer-page .mo-log-line { margin: 0 0 4px; }
    #media-optimizer .mo-log-line.success,
    .media-optimizer-page .mo-log-line.success { color: #86efac; }
    #media-optimizer .mo-log-line.error,
    .media-optimizer-page .mo-log-line.error { color: #fca5a5; }
    #media-optimizer .mo-log-line.warn,
    .media-optimizer-page .mo-log-line.warn { color: #fde68a; }
    #media-optimizer .mo-log-line.db,
    .media-optimizer-page .mo-log-line.db { color: #93c5fd; }
    #media-optimizer .mo-hint,
    .media-optimizer-page .mo-hint {
        font-size: 13px;
        color: var(--mo-text-muted) !important;
        margin-top: 12px;
    }
    #media-optimizer .mo-hint strong,
    .media-optimizer-page .mo-hint strong {
        color: var(--mo-text);
    }
    #media-optimizer .mo-alert,
    .media-optimizer-page .mo-alert {
        background: #fff3cd;
        border: 1px solid #ffeeba;
        color: #856404;
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 16px;
    }
</style>
