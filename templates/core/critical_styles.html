<style id="nda-critical-css">
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;padding:0;min-height:100%;line-height:1.5;background:#f5f5f5;color:#1a1a18;font-family:"Jost",system-ui,sans-serif}
  .page{width:100%;min-height:100vh;background-color:#f5f5f5}
  img,picture,video,canvas,svg{display:block;max-width:100%;height:auto}

  /* Hero / LCP — видно сразу, без ожидания styles.css */
  .hero{height:800px;overflow:hidden}
  .hero__inner{background:linear-gradient(135deg,#3e609a 0%,#00304e 100%);border-radius:15px;color:#fff}
  .hero__title,.t-hero-title{
    margin:0 0 27px;
    font-family:"Roboto",system-ui,sans-serif;
    font-weight:700;
    font-size:90px;
    line-height:120px;
    text-transform:uppercase;
    min-height:120px;
  }

  /* Логотипы в каталоге — место до загрузки картинки */
  .catalog__card-image{
    width:100%;
    max-width:280px;
    height:160px;
    flex-shrink:0;
  }
  .catalog__card-image img{
    width:100%;
    height:100%;
    object-fit:contain;
    aspect-ratio:262/140;
  }

  @media (max-width:640px){
    .hero{min-height:700px;height:auto;margin-top:10px}
    .hero__title,.t-hero-title{
      font-size:33px;
      line-height:40px;
      text-align:center;
      min-height:40px;
      margin-bottom:12px;
    }
  }
</style>
