<div class="callback-popup" id="mailPopup" role="dialog" aria-modal="true" aria-labelledby="emailModalLabel"
      aria-hidden="true" hidden>
      <div class="callback-popup__backdrop" data-mail-popup-close aria-label="Закрыть"></div>
      <div class="callback-popup-wrapper">
        <div class="callback-popup__modal">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="emailModalLabel">Написать письмо</h5>
              <button type="button" class="btn-close" data-mail-popup-close aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
              <form id="mail_form" action="{% url 'mail_submit' %}" method="post" enctype="multipart/form-data"
                novalidate>
                {% csrf_token %}
                <div id="form-messages"></div>
                <div class="form-floating mb-2">
                  {{ mail_form.name }}
                  <label for="{{ mail_form.name.id_for_label }}"></label>
                  <div class="invalid-feedback" id="name-errors"></div>
                </div>
                <div class="form-floating mb-2">
                  {{ mail_form.phone_number }}
                  <label for="{{ mail_form.phone_number.id_for_label }}"></label>
                  <div class="invalid-feedback" id="phone-errors"></div>
                </div>
                <div class="form-floating mb-2">
                  {{ mail_form.email }}
                  <label for="{{ mail_form.email.id_for_label }}"></label>
                  {% if mail_form.email.errors %}
                  <div class="text-danger">{{ mail_form.email.errors }}</div>
                  {% endif %}
                  <div class="invalid-feedback" id="email-errors"></div>
                </div>
                <div class="form-floating mb-2">
                  {{ mail_form.company_name }}
                  <label for="{{ mail_form.company_name.id_for_label }}"></label>
                  <div class="invalid-feedback" id="company-errors"></div>
                </div>
                <div class="form-floating mb-2">
                  {{ mail_form.inn }}
                  <label for="{{ mail_form.inn.id_for_label }}"></label>
                  <div class="invalid-feedback" id="inn-errors"></div>
                </div>
                <div class="form-floating mb-2">
                  {{ mail_form.message }}
                  <label for="{{ mail_form.message.id_for_label }}"></label>
                  <div class="invalid-feedback" id="message-errors"></div>
                </div>
                <div class="mb-2">
                  <label class="input-file">
                    {{ mail_form.company_details }}
                    <span>Прикрепить файл</span>
                  </label>
                  <div class="invalid-feedback" id="file-errors"></div>
                </div>
                <div id="form-response"></div>
                <div id="captcha-container" class="smart-captcha" data-sitekey="ysc1_sxny6cNZmnvhyJKrojDDLNxj0nvkGnTleldHzqEo9d9475ca"></div>
                <div class="order-popup__checkbox-wrap order-popup__checkbox-wrap_cookie mt-3 mb-2">
                  <input type="checkbox" class="order-popup__checkbox" name="mail_privacy" id="mailPopupPrivacy" required>
                  <label class="order-popup__checkbox-label" for="mailPopupPrivacy">Я прочел (прочла) Уведомление о
                    <a href="politika.html" class="order-popup__privacy-link">политики конфиденциальности</a></label>
                </div>
                <button type="submit" class="btn btn-success w-100">
                  <span id="submit-text">Отправить</span>
                  <span id="submit-indicator" class="spinner-border spinner-border-sm htmx-indicator" aria-hidden="true"></span>
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
