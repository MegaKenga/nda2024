<form class="order-popup__form" id="cart_modal_form" action="{% url 'cart_submit' %}" method="post"
      enctype="multipart/form-data" novalidate hidden>
    {% csrf_token %}
    <div id="modal_form_container">
        <div class="order-popup__form-panel order-popup__form-panel_legal" data-order-panel="legal"
             role="tabpanel" hidden>
            <div class="physicalForm">
                <div class="formEl">
                    <div class="form-floating mb-3">{{ contact_form.name }}
                        <label for="fullNameLegal">ФИО контактного лица</label>
                    </div>
                    <div class="oneLine">
                        <div class="form-floating mb-3 w-50">
                            {{ contact_form.phone_number }}
                        </div>
                        <div class="form-floating mb-3 w-50">
                            {{ contact_form.email }}
                        </div>
                      </div>
                      <div class="oneLine">
                          <div class="form-floating mb-3 w-50">
                              {{ contact_form.company_name }}
                              <label for="companyName">Наименование организации</label>
                          </div>
                          <div class="form-floating mb-3 w-50">
                              {{ contact_form.inn }}
                              <label for="inn">ИНН</label>
                          </div>
                      </div>
                    <div class="form-floating mb-3">
                        {{ contact_form.message }}
                        <label for="message">Комментарий к заказу</label>
                    </div>
                    <div class="mb-3">
                        <label class="input-file">
                            {{ contact_form.company_details }}
                            <span class="filename">Прикрепить файл</span>
                        </label>
                    </div>
                    <div id="captcha-container-legal" class="smart-captcha mb-3"
                         data-sitekey="ysc1_sxny6cNZmnvhyJKrojDDLNxj0nvkGnTleldHzqEo9d9475ca"></div>
                    <div class="modal-footer">
                        <button type="submit" form="cart_modal_form" class="btn btn-primary">Отправить запрос</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>
